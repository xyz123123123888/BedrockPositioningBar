# ============================================================
# BedrockPositioningBar - Gradle 属性
# 目标: Minecraft 26.2 (Fabric Loader 0.19.3)
# ============================================================

# 使用的 Minecraft 游戏版本（稳定版）
minecraft_version=26.2

# Fabric Loader 版本（26.2 对应的最新稳定版）
fabric_loader_version=0.19.3

# Fabric API 版本（26.2 对应的最新稳定版）
fabric_api_version=0.157.0+26.2

# 模组元信息
mod_version=0.1.0
maven_group=com.moxi
archives_base_name=bedrockpositioningbar

# 强制使用 Java 25（用户环境为 Java 25.0.3 LTS）
java_version=25

# 开启 Gradle 配置缓存与并行以加速构建
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
